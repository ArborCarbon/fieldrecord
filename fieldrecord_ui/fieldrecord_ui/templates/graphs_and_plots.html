<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Names and File Upload</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7H UibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <link rel = "stylesheet" type = "text/css" href = "static/style.css">
	<script src = "static/script.js"></script>
</head>
<body>
    <div class="container mt-5">
        
        <div class="upload">
        <h1 class="text-center mb-4">Column Names and File Upload</h1>
        <form action="/upload_graphs" method="POST" enctype="multipart/form-data" onsubmit="loader()">
            <div class="form-group">
                <label for="region_col">Region Column</label>
                <input type="text" class="form-control" id="region_col" name="region_col" value="Region" required>
            </div>
            <div class="form-group">
                <label for="district_col">District Column</label>
                <input type="text" class="form-control" id="district_col" name="district_col" value="DistrictName" required>
            </div>
            <div class="form-group">
                <label for="code_col">Code Column</label>
                <input type="text" class="form-control" id="code_col" name="code_col" value="CODE" required>
            </div>
            <div class="form-group">
                <label for="area_col">Area Column</label>
                <input type="text" class="form-control" id="area_col" name="area_col" value="SHAPE_Area" required>
            </div>
            <div class="form-group">
                <label for="region_col">Year</label>
                <input type="text" class="form-control" id="year" name="year" value="2025" required>
            </div>
            <div class="form-group">
                <label for="pest_area_file">Pest Area Excel</label>
                <input type="file" class="form-control-file" id="pest_area_file" name="pest_area_file" required>
            </div>
            <div class="form-group">
                <label for="final_pest_area_file">Final Pest Area Previous Years Excel</label>
                <input type="file" class="form-control-file" id="final_pest_area_file" name="final_pest_area_file" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        </div>
        <div class="loading" style="display: none">
			<h1>Processing...</h1>
			<div class="loader"></div>
		</div>
    </div>
</body>
</html>
